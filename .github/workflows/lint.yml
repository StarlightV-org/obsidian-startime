name: Validate Obsidian plugin

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out plugin source
        uses: actions/checkout@v6

      - name: Check out Bun workspace lockfiles
        uses: actions/checkout@v6
        with:
          repository: StarlightV-org/startime
          ref: obsidian-startime
          path: workspace
          sparse-checkout: |
            package.json
            bun.lock
            extentions/obsidian-startime/**
            packages/print/**
            tsconfig.base.json
          sparse-checkout-cone-mode: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install workspace dependencies
        run: |
          cd workspace
          bun install --frozen-lockfile

      - name: Build plugin
        run: bun run --cwd workspace/extentions/obsidian-startime build

      - name: Lint plugin
        run: bun run --cwd workspace/extentions/obsidian-startime lint
