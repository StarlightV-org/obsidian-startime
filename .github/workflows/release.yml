name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out plugin release source
        uses: actions/checkout@v6

      - name: Check out Bun workspace lockfiles
        uses: actions/checkout@v6
        with:
          repository: StarlightV-org/startime
          ref: obsidian-startime
          path: workspace
          sparse-checkout: |
            package.json
            bun.lock
          sparse-checkout-cone-mode: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Build plugin
        run: |
          mkdir -p workspace/extentions/obsidian-startime
          git archive HEAD | tar -x -C workspace/extentions/obsidian-startime

          cd workspace
          bun install --frozen-lockfile
          bun run --cwd extentions/obsidian-startime build

          cp extentions/obsidian-startime/main.js ../main.js

      - name: Check for optional styles
        id: styles
        run: |
          [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Create zip package
        run: |
          zip obsidian-codetime.zip main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            obsidian-codetime.zip
            ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json obsidian-codetime.zip ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
